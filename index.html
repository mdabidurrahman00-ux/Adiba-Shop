<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>বিক্রয় বাজার — Online Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">বিক্রয় বাজার</div>
  <div class="search"><input id="search" placeholder="পণ্য খুঁজুন..."></div>
  <button class="cartBtn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
</header>
<nav id="categories" class="categories"></nav>
<main>
  <section class="hero"><h1>আপনার প্রয়োজনের সবকিছু এক জায়গায়</h1><p>পছন্দের পণ্য বেছে নিন, অর্ডার দিন — অর্ডার সরাসরি WhatsApp-এ যাবে।</p></section>
  <section><div id="products" class="grid"></div><div id="empty" class="empty" hidden>কোনো পণ্য পাওয়া যায়নি।</div></section>
</main>
<div id="cartModal" class="modal" hidden>
  <div class="sheet"><button class="close" onclick="closeCart()">×</button><h2>আপনার কার্ট</h2><div id="cartItems"></div>
  <div class="total">মোট: ৳<span id="cartTotal">0</span></div>
  <div class="checkout">
    <input id="customerName" placeholder="আপনার নাম">
    <input id="customerPhone" placeholder="মোবাইল নম্বর">
    <textarea id="customerAddress" placeholder="সম্পূর্ণ ঠিকানা"></textarea>
    <select id="delivery"><option value="80">ঢাকা — ৳৮০</option><option value="130">ঢাকার বাহিরে — ৳১৩০</option></select>
    <button class="wa" onclick="sendWhatsApp()">WhatsApp-এ অর্ডার করুন</button>
  </div></div>
</div>
<footer>© <span id="year"></span> বিক্রয় বাজার</footer>
<script type="module" src="app.js"></script>
</body></html>
